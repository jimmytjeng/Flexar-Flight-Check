name: Flexar Pre-Flight Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send Telegram alert even if outside the ~75m window"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Singapore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests icalendar

      - name: Run flight check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ICS_URL: ${{ secrets.ICS_URL }}
          FORCE_SEND: ${{ inputs.force_send || 'false' }}
        run: python flight_check.py
